<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>STAIRS Mobile POC</title>
    <script src="pyodide/pyodide.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #0d0d0d;
        color: #eee;
        margin: 0;
        padding: 0;
      }
      header {
        padding: 1rem 1.25rem 0.75rem;
        border-bottom: 1px solid #2a2a2a;
        position: sticky;
        top: 0;
        background: #0d0d0d;
        z-index: 5;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 0.5rem;
      }
      .status-line {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: #999;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #666;
        flex-shrink: 0;
      }
      .status-dot.ready {
        background: #4caf50;
      }
      .status-dot.error {
        background: #e05555;
      }
      details.diagnostics {
        margin-top: 0.5rem;
      }
      details.diagnostics summary {
        font-size: 0.8rem;
        color: #888;
        cursor: pointer;
      }
      .step {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-left-width: 3px;
        border-radius: 6px;
        padding: 0.6rem 0.8rem;
        margin: 0.5rem 0;
      }
      .step .label {
        font-weight: 600;
        font-size: 0.85rem;
      }
      .step .detail {
        color: #aaa;
        font-size: 0.78rem;
        margin-top: 0.25rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .step.pending {
        border-left-color: #666;
      }
      .step.ok {
        border-left-color: #4caf50;
      }
      .step.fail {
        border-left-color: #e05555;
      }
      .location-bar {
        padding: 0.6rem 1.25rem;
        font-size: 0.9rem;
        color: #ccc;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .location-bar select {
        flex: 1;
        background: #1a1a1a;
        color: #eee;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 0.4rem 0.5rem;
        font-size: 0.88rem;
      }
      .tab-bar {
        display: flex;
        border-bottom: 1px solid #2a2a2a;
      }
      .tab-btn {
        flex: 1;
        background: none;
        border: none;
        color: #888;
        padding: 0.7rem;
        font-size: 0.9rem;
        font-weight: 600;
        border-bottom: 2px solid transparent;
      }
      .tab-btn.active {
        color: #ffc966;
        border-bottom-color: #ffc966;
      }
      #calendar-list {
        padding: 1rem 1.25rem 1.5rem;
      }
      .night-card {
        background: #161616;
        border: 1px solid #262626;
        border-left-width: 4px;
        border-radius: 8px;
        padding: 0.7rem 0.9rem;
        margin-bottom: 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .night-card .date {
        font-weight: 600;
        font-size: 0.9rem;
      }
      .night-card .sub {
        color: #888;
        font-size: 0.78rem;
        margin-top: 0.15rem;
      }
      .night-card .quality {
        font-size: 1.2rem;
        font-weight: 700;
        color: #ffc966;
      }
      .settings-section {
        padding: 1rem 1.25rem;
      }
      .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.6rem;
      }
      .settings-header h3 {
        margin: 0;
        font-size: 1rem;
        color: #ccc;
      }
      .add-btn {
        background: #262626;
        color: #ffc966;
        border: none;
        border-radius: 6px;
        padding: 0.4rem 0.7rem;
        font-size: 0.82rem;
        font-weight: 600;
      }
      .location-card,
      .profile-card {
        background: #161616;
        border: 1px solid #262626;
        border-radius: 8px;
        padding: 0.7rem 0.9rem;
        margin-bottom: 0.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }
      .location-card .name,
      .profile-card .name {
        font-weight: 600;
        font-size: 0.92rem;
      }
      .location-card .sub,
      .profile-card .sub {
        color: #888;
        font-size: 0.78rem;
        margin-top: 0.15rem;
      }
      .location-card .badge {
        color: #ffc966;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .form-field {
        margin-bottom: 0.9rem;
      }
      .form-field label {
        display: block;
        color: #999;
        font-size: 0.8rem;
        margin-bottom: 0.3rem;
      }
      .form-field input,
      .form-field select {
        width: 100%;
        padding: 0.55rem 0.7rem;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1e1e1e;
        color: #eee;
        font-size: 0.92rem;
      }
      .form-row {
        display: flex;
        gap: 0.6rem;
      }
      .form-row .form-field {
        flex: 1;
      }
      .btn-row {
        display: flex;
        gap: 0.6rem;
        margin-top: 0.5rem;
      }
      .btn-row button {
        flex: 1;
        padding: 0.7rem;
        border-radius: 8px;
        border: none;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .btn-primary {
        background: #ffc966;
        color: #111;
      }
      .btn-danger {
        background: #3a1f1f;
        color: #e05555;
      }
      .btn-secondary {
        background: #262626;
        color: #eee;
      }
      .search-bar {
        padding: 0.75rem 1.25rem;
      }
      .search-bar input {
        width: 100%;
        padding: 0.6rem 0.8rem;
        border-radius: 8px;
        border: 1px solid #333;
        background: #1a1a1a;
        color: #eee;
        font-size: 0.95rem;
      }
      #target-list {
        padding: 0 1.25rem 1.5rem;
      }
      .target-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.7rem 0.9rem;
        background: #161616;
        border: 1px solid #262626;
        border-radius: 8px;
        margin-bottom: 0.5rem;
        cursor: pointer;
      }
      .target-row:active {
        background: #222;
      }
      .target-row .name {
        font-weight: 600;
        font-size: 0.95rem;
      }
      .target-row .type {
        color: #888;
        font-size: 0.8rem;
      }
      .target-row .mag {
        color: #ffc966;
        font-size: 0.9rem;
        font-weight: 600;
      }
      #empty-state,
      #loading-state {
        color: #777;
        padding: 1rem 1.25rem;
        font-size: 0.9rem;
      }

      /* Detail panel (slide-up sheet) */
      #detail-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        z-index: 10;
      }
      #detail-overlay.open {
        display: block;
      }
      #detail-sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 80vh;
        overflow-y: auto;
        background: #151515;
        border-top: 1px solid #333;
        border-radius: 16px 16px 0 0;
        padding: 1.25rem;
        transform: translateY(100%);
        transition: transform 0.2s ease-out;
      }
      #detail-overlay.open #detail-sheet {
        transform: translateY(0);
      }
      #detail-sheet h2 {
        margin: 0 0 0.2rem;
        font-size: 1.15rem;
      }
      #detail-sheet .detail-sub {
        color: #888;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }
      .score-row {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .score-tile {
        flex: 1;
        background: #1e1e1e;
        border-radius: 10px;
        padding: 0.75rem;
        text-align: center;
      }
      .score-tile .value {
        font-size: 1.4rem;
        font-weight: 700;
        color: #ffc966;
      }
      .score-tile .label {
        color: #888;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .fact-row {
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0;
        border-bottom: 1px solid #262626;
        font-size: 0.88rem;
      }
      .fact-row .k {
        color: #999;
      }
      .close-btn {
        display: block;
        width: 100%;
        margin-top: 1rem;
        padding: 0.7rem;
        background: #262626;
        color: #eee;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
      }
      .spinner-line {
        color: #888;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>STAIRS</h1>
      <div class="status-line">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Starting engine…</span>
      </div>
      <details class="diagnostics">
        <summary>Engine diagnostics</summary>
        <div id="steps"></div>
      </details>
    </header>

    <div class="location-bar">
      📍
      <select id="location-select" disabled></select>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-targets">Targets</button>
      <button class="tab-btn" id="tab-calendar">Calendar</button>
      <button class="tab-btn" id="tab-settings">Settings</button>
    </div>

    <div id="targets-panel">
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="Search targets (name or type)…"
          disabled
        />
      </div>

      <div id="loading-state">
        Engine still starting - target list will appear here once ready…
      </div>
      <div id="target-list" style="display: none"></div>
      <div id="empty-state" style="display: none">
        No targets match your search.
      </div>
    </div>

    <div id="calendar-panel" style="display: none">
      <div id="calendar-list"></div>
    </div>

    <div id="settings-panel" style="display: none">
      <div class="settings-section">
        <div class="settings-header">
          <h3>Locations</h3>
          <button class="add-btn" id="add-location-btn">+ Add</button>
        </div>
        <div id="locations-list"></div>
      </div>
      <div class="settings-section">
        <div class="settings-header">
          <h3>Telescope</h3>
        </div>
        <div id="profile-summary" class="profile-card"></div>
      </div>
    </div>

    <div id="detail-overlay">
      <div id="detail-sheet"></div>
    </div>

    <script type="module">
      import * as duckdb from "./duckdb/duckdb-browser.bundle.mjs";

      const DEFAULT_LOCATIONS = [
        {
          name: "Home (Nashville, TN)",
          latitude: 36.16,
          longitude: -86.78,
          elevation_m: 180,
          bortle_scale: 5,
          timezone: "America/Chicago",
        },
        {
          name: "Dark Site (Big Bend, TX)",
          latitude: 29.25,
          longitude: -103.25,
          elevation_m: 1100,
          bortle_scale: 2,
          timezone: "America/Chicago",
        },
        {
          name: "Downtown Rooftop",
          latitude: 36.16,
          longitude: -86.78,
          elevation_m: 180,
          bortle_scale: 8,
          timezone: "America/Chicago",
        },
      ];
      const DEFAULT_PROFILE = {
        name: "Seestar-class",
        aperture_mm: 50,
        focal_length_mm: 250,
        sensor_x: 1920,
        sensor_y: 1080,
        pixel_pitch_um: 2.9,
      };
      const COMMON_TIMEZONES = [
        "America/New_York",
        "America/Chicago",
        "America/Denver",
        "America/Los_Angeles",
        "America/Anchorage",
        "America/Phoenix",
        "Pacific/Honolulu",
        "America/Sao_Paulo",
        "America/Mexico_City",
        "America/Toronto",
        "America/Vancouver",
        "Europe/London",
        "Europe/Paris",
        "Europe/Berlin",
        "Europe/Madrid",
        "Europe/Rome",
        "Europe/Moscow",
        "Europe/Athens",
        "Africa/Cairo",
        "Africa/Johannesburg",
        "Asia/Dubai",
        "Asia/Kolkata",
        "Asia/Shanghai",
        "Asia/Tokyo",
        "Asia/Seoul",
        "Asia/Singapore",
        "Australia/Sydney",
        "Australia/Perth",
        "Pacific/Auckland",
        "UTC",
      ];

      function loadLocations() {
        try {
          const raw = localStorage.getItem("stairs_locations");
          const parsed = raw ? JSON.parse(raw) : null;
          return Array.isArray(parsed) && parsed.length > 0
            ? parsed
            : DEFAULT_LOCATIONS;
        } catch {
          return DEFAULT_LOCATIONS;
        }
      }
      function saveLocations(locs) {
        localStorage.setItem("stairs_locations", JSON.stringify(locs));
      }
      function loadProfile() {
        try {
          const raw = localStorage.getItem("stairs_profile");
          return raw ? JSON.parse(raw) : DEFAULT_PROFILE;
        } catch {
          return DEFAULT_PROFILE;
        }
      }
      function saveProfile(p) {
        localStorage.setItem("stairs_profile", JSON.stringify(p));
      }

      let locations = loadLocations();
      let telescopeProfile = loadProfile();
      let selectedLocation =
        locations.find(
          (l) => l.name === localStorage.getItem("stairs_selected_location"),
        ) || locations[0];

      const stepsEl = document.getElementById("steps");
      const stepEls = {};
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const locationSelect = document.getElementById("location-select");
      const tabTargetsBtn = document.getElementById("tab-targets");
      const tabCalendarBtn = document.getElementById("tab-calendar");
      const tabSettingsBtn = document.getElementById("tab-settings");
      const targetsPanel = document.getElementById("targets-panel");
      const calendarPanel = document.getElementById("calendar-panel");
      const settingsPanel = document.getElementById("settings-panel");
      const calendarListEl = document.getElementById("calendar-list");
      const locationsListEl = document.getElementById("locations-list");
      const profileSummaryEl = document.getElementById("profile-summary");
      const searchInput = document.getElementById("search-input");
      const targetListEl = document.getElementById("target-list");
      const loadingStateEl = document.getElementById("loading-state");
      const emptyStateEl = document.getElementById("empty-state");
      const detailOverlay = document.getElementById("detail-overlay");
      const detailSheet = document.getElementById("detail-sheet");

      function refreshLocationSelect() {
        locationSelect.innerHTML = "";
        for (const loc of locations) {
          const opt = document.createElement("option");
          opt.value = loc.name;
          opt.textContent = `${loc.name} (Bortle ${loc.bortle_scale})`;
          locationSelect.appendChild(opt);
        }
        locationSelect.value = selectedLocation.name;
      }
      refreshLocationSelect();

      let pyodide, db, conn;

      function step(id, label) {
        const el = document.createElement("div");
        el.className = "step pending";
        el.innerHTML = `<div class="label">&#9203; ${label}</div><div class="detail"></div>`;
        stepsEl.appendChild(el);
        stepEls[id] = el;
      }
      function stepOk(id, detail) {
        const el = stepEls[id];
        el.className = "step ok";
        el.querySelector(".label").innerHTML =
          "&#9989; " +
          el.querySelector(".label").textContent.replace(/^\W+\s*/, "");
        el.querySelector(".detail").textContent = detail;
      }
      function stepFail(id, detail) {
        const el = stepEls[id];
        el.className = "step fail";
        el.querySelector(".label").innerHTML =
          "&#10060; " +
          el.querySelector(".label").textContent.replace(/^\W+\s*/, "");
        el.querySelector(".detail").textContent = detail;
        statusDot.className = "status-dot error";
        statusText.textContent =
          "Engine failed to start - see diagnostics below";
      }

      function setStatus(text, ready) {
        statusText.textContent = text;
        if (ready) statusDot.className = "status-dot ready";
      }

      async function initEngine() {
        step("pyodide-load", "Load Pyodide (Python 3.14 runtime, WASM)");
        try {
          pyodide = await loadPyodide({ indexURL: "pyodide/" });
          stepOk("pyodide-load", "Loaded");
        } catch (e) {
          stepFail("pyodide-load", e.message);
          return false;
        }

        step(
          "astropy-install",
          "Load astropy 7.2.0 + numpy + pandas + pydantic",
        );
        try {
          await pyodide.loadPackage([
            "numpy",
            "pandas",
            "micropip",
            "six",
            "pytz",
            "pydantic",
          ]);
          const micropip = pyodide.pyimport("micropip");
          await micropip.install(["astropy==7.2.0"]);
          stepOk("astropy-install", "Loaded");
        } catch (e) {
          stepFail("astropy-install", e.message);
          return false;
        }

        step(
          "astroplan-vendor",
          "Load real astroplan 0.10.1 + STAIRS's visibility/scoring/planner modules",
        );
        try {
          const manifestText = await (
            await fetch("vendor/manifest.txt")
          ).text();
          const files = manifestText.trim().split("\n").filter(Boolean);
          for (const rel of files) {
            const text = await (await fetch(`vendor/${rel}`)).text();
            const destPath = rel.includes("/")
              ? `/lib/python3.14/site-packages/${rel}`
              : `/home/${rel}`;
            pyodide.FS.mkdirTree(
              destPath.substring(0, destPath.lastIndexOf("/")),
            );
            pyodide.FS.writeFile(destPath, text);
          }
          pyodide.runPython(`
import sys
sys.path.insert(0, "/home")
from astropy.utils import iers
iers.conf.auto_max_age = None
iers.conf.auto_download = False

import visibility as v
import scoring as s
from telescope_profile import TelescopeProfile
from planner_models import ObservationLocation
from multi_night import MultiNightPlanner

def set_location(lat, lon, elev, bortle, tz):
    global _location, _observer
    _location = ObservationLocation(
        name="current", latitude=lat, longitude=lon, elevation_m=elev,
        bortle_scale=bortle, timezone=tz,
    )
    _observer = _location.get_observer()

def set_profile(name, aperture_mm, focal_length_mm, sensor_x, sensor_y, pixel_pitch_um):
    global _profile
    _profile = TelescopeProfile(
        name=name, aperture_mm=aperture_mm, focal_length_mm=focal_length_mm,
        sensor_x=sensor_x, sensor_y=sensor_y, pixel_pitch_um=pixel_pitch_um,
    )

set_location(${selectedLocation.latitude}, ${selectedLocation.longitude}, ${selectedLocation.elevation_m}, ${selectedLocation.bortle_scale}, "${selectedLocation.timezone}")
set_profile("${telescopeProfile.name}", ${telescopeProfile.aperture_mm}, ${telescopeProfile.focal_length_mm}, ${telescopeProfile.sensor_x}, ${telescopeProfile.sensor_y}, ${telescopeProfile.pixel_pitch_um})
`);
          stepOk("astroplan-vendor", `Loaded ${files.length} files`);
        } catch (e) {
          stepFail("astroplan-vendor", e.message);
          return false;
        }

        step("duckdb-init", "Initialize duckdb-wasm + load catalog");
        try {
          const bundle = {
            mainModule: new URL("duckdb/duckdb-eh.wasm", window.location.href)
              .href,
            mainWorker: new URL(
              "duckdb/duckdb-browser-eh.worker.js",
              window.location.href,
            ).href,
          };
          const workerUrl = URL.createObjectURL(
            new Blob([`importScripts("${bundle.mainWorker}");`], {
              type: "text/javascript",
            }),
          );
          const worker = new Worker(workerUrl);
          const logger = new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING);
          db = new duckdb.AsyncDuckDB(logger, worker);
          await db.instantiate(bundle.mainModule, bundle.pthreadWorker);

          const csvBuf = await (await fetch("NGC.csv")).arrayBuffer();
          await db.registerFileBuffer("NGC.csv", new Uint8Array(csvBuf));
          conn = await db.connect();
          await conn.query(`
            CREATE TABLE catalog AS
            SELECT * FROM read_csv('NGC.csv', delim=';', header=true, ignore_errors=true)
          `);
          const rowCount = (
            await conn.query(`SELECT COUNT(*)::INT AS n FROM catalog`)
          ).toArray()[0].n;
          stepOk("duckdb-init", `Loaded ${rowCount} catalog rows`);
        } catch (e) {
          stepFail("duckdb-init", e.message);
          return false;
        }

        return true;
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str ?? "";
        return div.innerHTML;
      }

      function renderTargets(rows) {
        loadingStateEl.style.display = "none";
        if (rows.length === 0) {
          targetListEl.style.display = "none";
          emptyStateEl.style.display = "block";
          return;
        }
        emptyStateEl.style.display = "none";
        targetListEl.style.display = "block";
        targetListEl.innerHTML = "";
        for (const r of rows) {
          const row = document.createElement("div");
          row.className = "target-row";
          row.innerHTML = `
            <div>
              <div class="name">${escapeHtml(r.Name)}</div>
              <div class="type">${escapeHtml(r.Type)} &middot; ${escapeHtml(
                r.Const,
              )}</div>
            </div>
            <div class="mag">${r["V-Mag"] ?? "?"}</div>
          `;
          row.addEventListener("click", () => showDetail(r));
          targetListEl.appendChild(row);
        }
      }

      async function runDefaultQuery() {
        const result = await conn.query(`
          SELECT Name, Type, Const, RA, "Dec", "V-Mag", MajAx
          FROM catalog
          WHERE Type NOT IN ('*', '**', 'NonEx', 'Dup')
            AND "V-Mag" IS NOT NULL AND RA IS NOT NULL AND "Dec" IS NOT NULL
          ORDER BY CAST("V-Mag" AS DOUBLE) ASC
          LIMIT 40
        `);
        renderTargets(result.toArray().map((r) => r.toJSON()));
      }

      async function runSearchQuery(term) {
        const escaped = term.replace(/'/g, "''").toUpperCase();
        const result = await conn.query(`
          SELECT Name, Type, Const, RA, "Dec", "V-Mag", MajAx
          FROM catalog
          WHERE Type NOT IN ('*', '**', 'NonEx', 'Dup')
            AND "V-Mag" IS NOT NULL AND RA IS NOT NULL AND "Dec" IS NOT NULL
            AND (UPPER(Name) LIKE '%${escaped}%' OR UPPER(Type) LIKE '%${escaped}%')
          ORDER BY CAST("V-Mag" AS DOUBLE) ASC
          LIMIT 40
        `);
        renderTargets(result.toArray().map((r) => r.toJSON()));
      }

      let searchDebounce;
      searchInput.addEventListener("input", (e) => {
        clearTimeout(searchDebounce);
        const term = e.target.value.trim();
        searchDebounce = setTimeout(() => {
          const query =
            term.length === 0 ? runDefaultQuery() : runSearchQuery(term);
          query.catch((err) => {
            console.error("search query failed:", err);
            renderTargets([]);
          });
        }, 200);
      });

      async function showDetail(target) {
        detailOverlay.classList.add("open");
        detailSheet.innerHTML = `
          <h2>${escapeHtml(target.Name)}</h2>
          <div class="detail-sub">${escapeHtml(target.Type)} in ${escapeHtml(
            target.Const,
          )} &middot; magnitude ${target["V-Mag"]}</div>
          <div class="spinner-line">Computing real visibility + score for right now…</div>
        `;

        try {
          const nowIso = new Date().toISOString().slice(0, 19);
          const raStr = target.RA;
          const decStr = target.Dec;
          const mag = parseFloat(target["V-Mag"]) || 15.0;
          const majAx = parseFloat(target.MajAx) || 1.0;

          pyodide.globals.set("_ra", raStr);
          pyodide.globals.set("_dec", decStr);
          pyodide.globals.set("_mag", mag);
          pyodide.globals.set("_size", majAx);
          pyodide.globals.set("_now_iso", nowIso);
          pyodide.globals.set("_name", target.Name);

          const result = await pyodide.runPythonAsync(`
from astropy.coordinates import SkyCoord
from astropy.time import Time
import astropy.units as u
import json

def safe_iso(t):
    # Some astroplan edge cases (e.g. a target that never crosses the
    # horizon at this latitude/declination) return a masked Time rather
    # than raising or returning None - guard the JSON serialization.
    try:
        if bool(getattr(t, "masked", False)):
            return None
        return str(t.iso)
    except Exception:
        return None

target_coord = SkyCoord(_ra, _dec, unit=(u.hourangle, u.deg), frame='icrs')
now = Time(_now_iso)

night = v.get_astronomical_night(_observer, now, date_window_days=14)
out = {"night_found": night is not None}

if night:
    night_start, night_end = night
    out["night_start_utc"] = safe_iso(night_start)
    out["night_end_utc"] = safe_iso(night_end)

    window = v.find_visible_window(_observer, target_coord, (night_start, night_end), min_alt=30.0)
    out["visible_tonight"] = window is not None
    if window:
        out["rise_utc"] = safe_iso(window[0])
        out["set_utc"] = safe_iso(window[1])
        if out["rise_utc"] is None or out["set_utc"] is None:
            out["visible_tonight"] = False

    peak_alt = float(v.get_peak_altitudes(_observer, target_coord, (night_start, night_end))[0])
    if peak_alt != peak_alt:  # NaN check - e.g. a target that never crosses the horizon here
        peak_alt = -90.0
    out["peak_altitude_deg"] = round(peak_alt, 1)

    moon_q = v.get_moon_quality(_observer, night_start)
    if moon_q != moon_q:
        moon_q = 1.0
    out["moon_quality"] = round(moon_q, 2)

    target_data = {"target_id": _name, "magnitude": _mag, "size_maj": _size, "size_min": _size}
    oss_rel, aqs_abs = s.calculate_oss(
        target_data, _profile, max_altitude=peak_alt, min_target_altitude=30.0, bortle_scale=_location.bortle_scale,
    )
    final_rel, final_abs = s.calculate_final_score(
        target_data, _profile, max_altitude=peak_alt, min_target_altitude=30.0,
        weather_data=None, bortle_scale=_location.bortle_scale, moon_multiplier=moon_q,
    )
    out["oss"] = oss_rel
    out["aqs"] = aqs_abs
    out["final_score"] = final_abs

json.dumps(out)
`);

          renderDetailResult(target, JSON.parse(result));
        } catch (e) {
          detailSheet.innerHTML += `<div class="step fail"><div class="detail">${escapeHtml(
            e.message,
          )}</div></div>`;
        }
      }

      function utcToLocalTime(iso) {
        if (!iso) return "-";
        const d = new Date(iso.replace(" ", "T") + "Z");
        return d.toLocaleString(undefined, {
          hour: "2-digit",
          minute: "2-digit",
          month: "short",
          day: "numeric",
        });
      }

      function renderDetailResult(target, r) {
        if (!r.night_found) {
          detailSheet.innerHTML += `<div class="fact-row"><span class="k">Tonight</span><span>No astronomical darkness found in the next 14 days at this location</span></div>`;
        } else if (!r.visible_tonight) {
          detailSheet.innerHTML = detailSheet.innerHTML.replace(
            /<div class="spinner-line">.*?<\/div>/,
            "",
          );
          detailSheet.innerHTML += `
            <div class="fact-row"><span class="k">Astronomical night</span><span>${utcToLocalTime(
              r.night_start_utc,
            )} &ndash; ${utcToLocalTime(r.night_end_utc)}</span></div>
            <div class="fact-row"><span class="k">Peak altitude tonight</span><span>${
              r.peak_altitude_deg
            }&deg;</span></div>
            <div class="fact-row"><span class="k">Above 30&deg;?</span><span>Not tonight from this location</span></div>
          `;
        } else {
          detailSheet.innerHTML = detailSheet.innerHTML.replace(
            /<div class="spinner-line">.*?<\/div>/,
            "",
          );
          detailSheet.innerHTML += `
            <div class="score-row">
              <div class="score-tile"><div class="value">${
                r.oss
              }</div><div class="label">OSS</div></div>
              <div class="score-tile"><div class="value">${
                r.aqs
              }</div><div class="label">AQS</div></div>
              <div class="score-tile"><div class="value">${
                r.final_score
              }</div><div class="label">Final</div></div>
            </div>
            <div class="fact-row"><span class="k">Visible window (rise&ndash;set)</span><span>${utcToLocalTime(
              r.rise_utc,
            )} &ndash; ${utcToLocalTime(r.set_utc)}</span></div>
            <div class="fact-row"><span class="k">Peak altitude tonight</span><span>${
              r.peak_altitude_deg
            }&deg;</span></div>
            <div class="fact-row"><span class="k">Moon quality</span><span>${
              r.moon_quality
            } (1.0 = no interference)</span></div>
          `;
        }
        const closeBtn = document.createElement("button");
        closeBtn.className = "close-btn";
        closeBtn.textContent = "Close";
        closeBtn.addEventListener("click", () =>
          detailOverlay.classList.remove("open"),
        );
        detailSheet.appendChild(closeBtn);
      }

      detailOverlay.addEventListener("click", (e) => {
        if (e.target === detailOverlay) detailOverlay.classList.remove("open");
      });

      function qualityColor(absQuality) {
        if (absQuality >= 50) return "#4caf50";
        if (absQuality >= 20) return "#ffc966";
        return "#e05555";
      }

      async function runCalendar() {
        calendarListEl.innerHTML = `<div class="spinner-line">Computing 14-night forecast for ${escapeHtml(
          selectedLocation.name,
        )}…</div>`;
        try {
          const result = await pyodide.runPythonAsync(`
from astropy.time import Time
import json

planner = MultiNightPlanner(_location)
forecast = planner.generate_forecast(days=14, start_time=Time.now())
json.dumps([
    {
        "date": d.date, "dark_hrs": d.total_dark_hours, "eff_hrs": d.effective_hours,
        "rel_quality": d.relative_quality, "abs_quality": d.absolute_quality, "note": d.note,
    }
    for d in forecast
])
`);
          const nights = JSON.parse(result);
          calendarListEl.innerHTML = "";
          for (const n of nights) {
            const card = document.createElement("div");
            card.className = "night-card";
            card.style.borderLeftColor = qualityColor(n.abs_quality);
            const dateObj = new Date(n.date + "T12:00:00");
            const dateStr = dateObj.toLocaleDateString(undefined, {
              weekday: "short",
              month: "short",
              day: "numeric",
            });
            card.innerHTML = `
              <div>
                <div class="date">${dateStr}</div>
                <div class="sub">${n.dark_hrs}h dark &middot; ${
                  n.eff_hrs
                }h effective${
                  n.note ? " &middot; " + escapeHtml(n.note) : ""
                }</div>
              </div>
              <div class="quality">${n.abs_quality}</div>
            `;
            calendarListEl.appendChild(card);
          }
        } catch (e) {
          calendarListEl.innerHTML = `<div class="step fail"><div class="detail">${escapeHtml(
            e.message,
          )}</div></div>`;
        }
      }

      function showTab(tab) {
        tabTargetsBtn.classList.toggle("active", tab === "targets");
        tabCalendarBtn.classList.toggle("active", tab === "calendar");
        tabSettingsBtn.classList.toggle("active", tab === "settings");
        targetsPanel.style.display = tab === "targets" ? "block" : "none";
        calendarPanel.style.display = tab === "calendar" ? "block" : "none";
        settingsPanel.style.display = tab === "settings" ? "block" : "none";
        if (tab === "calendar") runCalendar();
        if (tab === "settings") {
          renderLocationsList();
          renderProfileSummary();
        }
      }
      tabTargetsBtn.addEventListener("click", () => showTab("targets"));
      tabCalendarBtn.addEventListener("click", () => showTab("calendar"));
      tabSettingsBtn.addEventListener("click", () => showTab("settings"));

      function applyLocationChange(loc) {
        selectedLocation = loc;
        localStorage.setItem("stairs_selected_location", loc.name);
        pyodide.runPython(
          `set_location(${loc.latitude}, ${loc.longitude}, ${loc.elevation_m}, ${loc.bortle_scale}, "${loc.timezone}")`,
        );
        if (calendarPanel.style.display !== "none") runCalendar();
      }

      locationSelect.addEventListener("change", (e) => {
        const loc = locations.find((l) => l.name === e.target.value);
        if (loc) applyLocationChange(loc);
      });

      // ---------- Settings: Locations ----------

      function renderLocationsList() {
        locationsListEl.innerHTML = "";
        for (const loc of locations) {
          const card = document.createElement("div");
          card.className = "location-card";
          card.innerHTML = `
            <div>
              <div class="name">${escapeHtml(loc.name)}</div>
              <div class="sub">${loc.latitude.toFixed(
                2,
              )}, ${loc.longitude.toFixed(2)} &middot; ${escapeHtml(
                loc.timezone,
              )}</div>
            </div>
            <div class="badge">Bortle ${loc.bortle_scale}</div>
          `;
          card.addEventListener("click", () => showLocationForm(loc));
          locationsListEl.appendChild(card);
        }
      }

      function timezoneOptionsHtml(selected) {
        return COMMON_TIMEZONES.map(
          (tz) =>
            `<option value="${tz}" ${
              tz === selected ? "selected" : ""
            }>${tz}</option>`,
        ).join("");
      }

      function showLocationForm(existing) {
        detailOverlay.classList.add("open");
        const isNew = !existing;
        const loc = existing || {
          name: "",
          latitude: 0,
          longitude: 0,
          elevation_m: 0,
          bortle_scale: 5,
          timezone: "UTC",
        };

        detailSheet.innerHTML = `
          <h2>${isNew ? "Add Location" : "Edit Location"}</h2>
          <div class="form-field">
            <label>Name</label>
            <input type="text" id="f-name" value="${escapeHtml(
              loc.name,
            )}" placeholder="e.g. Grandma's Backyard" />
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Latitude</label>
              <input type="number" id="f-lat" value="${
                loc.latitude
              }" step="0.0001" min="-90" max="90" />
            </div>
            <div class="form-field">
              <label>Longitude</label>
              <input type="number" id="f-lon" value="${
                loc.longitude
              }" step="0.0001" min="-180" max="180" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Elevation (m)</label>
              <input type="number" id="f-elev" value="${
                loc.elevation_m
              }" step="1" min="0" />
            </div>
            <div class="form-field">
              <label>Bortle Scale</label>
              <select id="f-bortle">
                ${[1, 2, 3, 4, 5, 6, 7, 8, 9]
                  .map(
                    (b) =>
                      `<option value="${b}" ${
                        b === loc.bortle_scale ? "selected" : ""
                      }>${b}</option>`,
                  )
                  .join("")}
              </select>
            </div>
          </div>
          <div class="form-field">
            <label>Timezone</label>
            <select id="f-tz">${timezoneOptionsHtml(loc.timezone)}</select>
          </div>
          <div class="btn-row">
            <button class="btn-secondary" id="f-cancel">Cancel</button>
            <button class="btn-primary" id="f-save">Save</button>
          </div>
          ${
            !isNew && locations.length > 1
              ? `<div class="btn-row"><button class="btn-danger" id="f-delete">Delete Location</button></div>`
              : ""
          }
        `;

        document
          .getElementById("f-cancel")
          .addEventListener("click", () =>
            detailOverlay.classList.remove("open"),
          );

        document.getElementById("f-save").addEventListener("click", () => {
          const name = document.getElementById("f-name").value.trim();
          if (!name) return;
          const updated = {
            name,
            latitude: parseFloat(document.getElementById("f-lat").value),
            longitude: parseFloat(document.getElementById("f-lon").value),
            elevation_m:
              parseFloat(document.getElementById("f-elev").value) || 0,
            bortle_scale: parseInt(
              document.getElementById("f-bortle").value,
              10,
            ),
            timezone: document.getElementById("f-tz").value,
          };
          if (
            isNaN(updated.latitude) ||
            updated.latitude < -90 ||
            updated.latitude > 90
          )
            return;
          if (
            isNaN(updated.longitude) ||
            updated.longitude < -180 ||
            updated.longitude > 180
          )
            return;

          if (isNew) {
            locations = [...locations, updated];
          } else {
            locations = locations.map((l) => (l === existing ? updated : l));
            if (
              selectedLocation === existing ||
              selectedLocation.name === existing.name
            ) {
              selectedLocation = updated;
            }
          }
          saveLocations(locations);
          refreshLocationSelect();
          renderLocationsList();
          if (selectedLocation.name === updated.name)
            applyLocationChange(updated);
          detailOverlay.classList.remove("open");
        });

        const deleteBtn = document.getElementById("f-delete");
        if (deleteBtn) {
          deleteBtn.addEventListener("click", () => {
            locations = locations.filter((l) => l !== existing);
            saveLocations(locations);
            if (
              selectedLocation === existing ||
              selectedLocation.name === existing.name
            ) {
              applyLocationChange(locations[0]);
            }
            refreshLocationSelect();
            renderLocationsList();
            detailOverlay.classList.remove("open");
          });
        }
      }

      document
        .getElementById("add-location-btn")
        .addEventListener("click", () => showLocationForm(null));

      // ---------- Settings: Telescope Profile ----------

      function renderProfileSummary() {
        const p = telescopeProfile;
        profileSummaryEl.innerHTML = `
          <div>
            <div class="name">${escapeHtml(p.name)}</div>
            <div class="sub">${p.aperture_mm}mm aperture &middot; f/${(
              p.focal_length_mm / p.aperture_mm
            ).toFixed(1)} &middot; ${p.sensor_x}&times;${p.sensor_y}px</div>
          </div>
          <div class="badge">Edit</div>
        `;
        profileSummaryEl.addEventListener("click", showProfileForm, {
          once: true,
        });
      }

      function showProfileForm() {
        detailOverlay.classList.add("open");
        const p = telescopeProfile;
        detailSheet.innerHTML = `
          <h2>Telescope Profile</h2>
          <div class="form-field">
            <label>Name</label>
            <input type="text" id="p-name" value="${escapeHtml(p.name)}" />
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Aperture (mm)</label>
              <input type="number" id="p-aperture" value="${
                p.aperture_mm
              }" min="1" />
            </div>
            <div class="form-field">
              <label>Focal Length (mm)</label>
              <input type="number" id="p-focal" value="${
                p.focal_length_mm
              }" min="1" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-field">
              <label>Sensor Width (px)</label>
              <input type="number" id="p-sx" value="${p.sensor_x}" min="1" />
            </div>
            <div class="form-field">
              <label>Sensor Height (px)</label>
              <input type="number" id="p-sy" value="${p.sensor_y}" min="1" />
            </div>
          </div>
          <div class="form-field">
            <label>Pixel Pitch (&micro;m)</label>
            <input type="number" id="p-pitch" value="${
              p.pixel_pitch_um
            }" step="0.1" min="0.1" />
          </div>
          <div class="btn-row">
            <button class="btn-secondary" id="p-cancel">Cancel</button>
            <button class="btn-primary" id="p-save">Save</button>
          </div>
        `;
        document
          .getElementById("p-cancel")
          .addEventListener("click", () =>
            detailOverlay.classList.remove("open"),
          );
        document.getElementById("p-save").addEventListener("click", () => {
          const updated = {
            name: document.getElementById("p-name").value.trim() || "Custom",
            aperture_mm: parseInt(
              document.getElementById("p-aperture").value,
              10,
            ),
            focal_length_mm: parseInt(
              document.getElementById("p-focal").value,
              10,
            ),
            sensor_x: parseInt(document.getElementById("p-sx").value, 10),
            sensor_y: parseInt(document.getElementById("p-sy").value, 10),
            pixel_pitch_um: parseFloat(
              document.getElementById("p-pitch").value,
            ),
          };
          for (const v of Object.values(updated)) {
            if (typeof v === "number" && (isNaN(v) || v <= 0)) return;
          }
          telescopeProfile = updated;
          saveProfile(updated);
          pyodide.runPython(
            `set_profile("${updated.name}", ${updated.aperture_mm}, ${updated.focal_length_mm}, ${updated.sensor_x}, ${updated.sensor_y}, ${updated.pixel_pitch_um})`,
          );
          renderProfileSummary();
          detailOverlay.classList.remove("open");
        });
      }

      (async () => {
        const ok = await initEngine();
        if (!ok) return;
        setStatus("Ready", true);
        searchInput.disabled = false;
        locationSelect.disabled = false;
        await runDefaultQuery();
      })();
    </script>
  </body>
</html>
