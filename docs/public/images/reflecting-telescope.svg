<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffcc00" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="none"/>

  <!-- Optical Axis -->
  <line x1="20" y1="125" x2="380" y2="125" stroke="#666" stroke-dasharray="4" stroke-width="1"/>

  <!-- Primary Mirror (Concave) -->
  <path d="M 350 75 Q 330 125 350 175" fill="none" stroke="#999" stroke-width="4"/>
  <text x="350" y="200" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">Primary Mirror</text>

  <!-- Secondary Mirror (Flat/Angled) -->
  <line x1="150" y1="105" x2="180" y2="145" stroke="#999" stroke-width="3"/>
  <text x="165" y="90" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">Secondary Mirror</text>

  <!-- Light Rays (Incoming) -->
  <line x1="10" y1="85" x2="330" y2="85" stroke="#ffcc00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="10" y1="165" x2="330" y2="165" stroke="#ffcc00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="85" x2="342" y2="85" stroke="#ffcc00" stroke-width="2"/>
  <line x1="330" y1="165" x2="342" y2="165" stroke="#ffcc00" stroke-width="2"/>

  <!-- Light Rays (Reflecting to Secondary) -->
  <line x1="342" y1="85" x2="180" y2="122" stroke="#ffcc00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="342" y1="165" x2="180" y2="128" stroke="#ffcc00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="122" x2="165" y2="125" stroke="#ffcc00" stroke-width="2"/>
  <line x1="180" y1="128" x2="165" y2="125" stroke="#ffcc00" stroke-width="2"/>

  <!-- Light Rays (To Sensor) -->
  <line x1="165" y1="125" x2="165" y2="190" stroke="#ffcc00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sensor -->
  <rect x="150" y="200" width="30" height="10" fill="#333"/>
  <text x="165" y="230" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">Sensor</text>

  <!-- Labels -->
  <text x="185" y="60" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">Reflecting Telescope</text>
</svg>
