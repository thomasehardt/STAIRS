<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffcc00" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="none"/>

  <!-- Optical Axis -->
  <line x1="20" y1="125" x2="380" y2="125" stroke="#666" stroke-dasharray="4" stroke-width="1"/>

  <!-- Objective Lens -->
  <path d="M 50 75 Q 65 125 50 175 Q 35 125 50 75" fill="#aaddff" stroke="#0077cc" stroke-width="2" opacity="0.8"/>
  <text x="50" y="200" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">Objective Lens</text>

  <!-- Light Rays (Incoming) -->
  <line x1="10" y1="85" x2="45" y2="85" stroke="#ffcc00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="10" y1="165" x2="45" y2="165" stroke="#ffcc00" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Connect rays to lens -->
  <line x1="45" y1="85" x2="50" y2="85" stroke="#ffcc00" stroke-width="2"/>
  <line x1="45" y1="165" x2="50" y2="165" stroke="#ffcc00" stroke-width="2"/>

  <!-- Light Rays (Converging) -->
  <line x1="50" y1="85" x2="310" y2="123" stroke="#ffcc00" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="50" y1="165" x2="310" y2="127" stroke="#ffcc00" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sensor -->
  <rect x="315" y="110" width="10" height="30" fill="#333"/>
  <text x="320" y="160" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#333">Sensor</text>

  <!-- Labels -->
  <text x="185" y="60" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">Refracting Telescope</text>
</svg>
