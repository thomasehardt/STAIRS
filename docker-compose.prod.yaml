services:
  api:
    image: ghcr.io/thomasehardt/stairs/stairs-api:latest
    container_name: stairs-api
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./services/api/data:/app/data:ro
      - ./cache:/app_data/cache
      - ./logs:/app_data/logs
    environment:
      - CACHE_DIR=/app_data/cache
      - LOG_DIR=/app_data/logs
      - DATA_DIR=/app/data
      - CONFIG_FILE=/app/config.yaml

  web:
    image: ghcr.io/thomasehardt/stairs/stairs-web:latest
    container_name: stairs-web
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "3000:8080"
    # Note: VITE_API_URL must be set at build time in the Dockerfile.
    # This environment variable is ignored by the static web files but kept for documentation.
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api

  cli:
    image: ghcr.io/thomasehardt/stairs/stairs-cli:latest
    container_name: stairs-cli
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
