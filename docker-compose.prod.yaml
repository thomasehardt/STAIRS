services:
  api:
    image: ghcr.io/thomasehardt/stairs/stairs-api:${STAIRS_IMAGE_TAG:-latest}
    container_name: stairs-api
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./cache:/app_data/cache
      - ./logs:/app_data/logs
    environment:
      - CACHE_DIR=/app_data/cache
      - LOG_DIR=/app_data/logs
      - DATA_DIR=/app/data
      - CONFIG_FILE=/app/config.yaml

  web:
    image: ghcr.io/thomasehardt/stairs/stairs-web:${STAIRS_IMAGE_TAG:-latest}
    container_name: stairs-web
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - api
