<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altitude Graph - Cyber Theme</title>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00d4ff;
            --neon-purple: #bf00ff;
            --deep-space: #050510;
            --space-surface: rgba(5, 5, 16, 0.9);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(0, 212, 255, 0.3);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--deep-space);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .holo-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(191, 0, 255, 0.05) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 1000px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.1);
        }

        .cyber-header {
            border-left: 4px solid var(--neon-blue);
            padding-left: 20px;
            margin-bottom: 30px;
        }

        .cyber-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--neon-blue);
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .cyber-subtitle {
            font-family: var(--font-display);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-top: 5px;
        }

        .chart-container {
            height: 400px;
            width: 100%;
            position: relative;
        }

        .cyber-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-display);
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-line {
            height: 2px;
            width: 20px;
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>

    <div class="holo-card">
        <div class="cyber-header">
            <h1 class="cyber-title">Altitude Telemetry</h1>
            <div class="cyber-subtitle">Celestial Tracking // Object Path v3.2</div>
        </div>

        <div class="chart-container">
            <canvas id="altitudeChart"></canvas>
        </div>

        <div class="cyber-footer">
            <div class="flex gap-6">
                <div class="legend-item">
                    <div class="legend-line bg-gray-500" style="height: 1px;"></div>
                    <span>RESTRICTED (1px)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: var(--neon-blue); height: 3px; box-shadow: 0 0 10px var(--neon-blue);"></div>
                    <span style="color: var(--neon-blue);">OPTIMAL (3px)</span>
                </div>
            </div>
            <div class="font-mono opacity-50">SYS.VER_2026.4.05</div>
        </div>
    </div>

    <script>
        // Starfield background script
        const starCanvas = document.getElementById('starfield');
        const starCtx = starCanvas.getContext('2d');
        let stars = [];

        function initStars() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * starCanvas.width,
                    y: Math.random() * starCanvas.height,
                    size: Math.random() * 1.5,
                    opacity: Math.random(),
                    speed: Math.random() * 0.05
                });
            }
        }

        function drawStars() {
            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            stars.forEach(star => {
                starCtx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                starCtx.beginPath();
                starCtx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                starCtx.fill();
                star.opacity += (Math.random() - 0.5) * 0.02;
                if (star.opacity < 0.1) star.opacity = 0.1;
                if (star.opacity > 0.8) star.opacity = 0.8;
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', initStars);
        initStars();
        drawStars();

        // Chart.js Implementation
        const ctx = document.getElementById('altitudeChart').getContext('2d');

        const labels = [];
        const data = [];

        for (let t = 6; t <= 18; t += 0.1) {
            labels.push(t);
            const altitude = Math.max(0, 90 * Math.sin(Math.PI * (t - 6) / 12));
            data.push(altitude);
        }

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Altitude',
                    data: data,
                    fill: false,
                    pointRadius: 0,
                    tension: 0.1,
                    segment: {
                        borderColor: ctx => {
                            const y = (ctx.p0.parsed.y + ctx.p1.parsed.y) / 2;
                            return (y >= 29.9 && y <= 80.1) ? '#00d4ff' : '#666';
                        },
                        borderWidth: ctx => {
                            const y = (ctx.p0.parsed.y + ctx.p1.parsed.y) / 2;
                            return (y >= 29.9 && y <= 80.1) ? 3 : 1;
                        },
                        borderDash: ctx => {
                            // Optionally dash the out-of-range segments
                            // const y = (ctx.p0.parsed.y + ctx.p1.parsed.y) / 2;
                            // return (y >= 29.9 && y <= 80.1) ? [] : [2, 2];
                        }
                    }
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        min: 6,
                        max: 18,
                        grid: { display: false },
                        ticks: {
                            stepSize: 1,
                            callback: value => {
                                const h = Math.floor(value);
                                const ampm = h >= 12 ? 'PM' : 'AM';
                                const dh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
                                return `${dh} ${ampm}`;
                            },
                            color: 'rgba(255, 255, 255, 0.3)',
                            font: { family: 'Orbitron', size: 10 }
                        }
                    },
                    y: {
                        min: 0,
                        max: 90,
                        grid: { color: 'rgba(255, 255, 255, 0.05)' },
                        ticks: {
                            stepSize: 10,
                            color: 'rgba(255, 255, 255, 0.3)',
                            font: { family: 'Orbitron', size: 10 }
                        }
                    }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(5, 5, 16, 0.95)',
                        titleColor: '#00d4ff',
                        titleFont: { family: 'Orbitron', size: 12 },
                        bodyColor: '#ffffff',
                        bodyFont: { family: 'Rajdhani', size: 14 },
                        borderColor: 'rgba(0, 212, 255, 0.3)',
                        borderWidth: 1,
                        padding: 15,
                        displayColors: false,
                        callbacks: {
                            title: items => {
                                const t = items[0].parsed.x;
                                const h = Math.floor(t);
                                const m = Math.round((t - h) * 60);
                                const ampm = h >= 12 ? 'PM' : 'AM';
                                const dh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
                                return `${dh}:${m.toString().padStart(2, '0')} ${ampm}`;
                            },
                            label: item => `ALTITUDE: ${item.parsed.y.toFixed(2)}°`
                        }
                    },
                    annotation: {
                        annotations: {
                            shading: {
                                type: 'box',
                                yMin: 30,
                                yMax: 80,
                                backgroundColor: 'rgba(0, 212, 255, 0.03)',
                                borderWidth: 0,
                                z: -1
                            },
                            line30: {
                                type: 'line',
                                yMin: 30,
                                yMax: 30,
                                borderColor: 'rgba(255, 255, 255, 0.2)',
                                borderWidth: 1,
                                borderDash: [8, 4],
                                label: {
                                    display: true,
                                    content: '30° MIN',
                                    position: 'start',
                                    yAdjust: -12,
                                    backgroundColor: 'transparent',
                                    color: 'rgba(255, 255, 255, 0.4)',
                                    font: { family: 'Orbitron', size: 9, weight: 'bold' }
                                }
                            },
                            line80: {
                                type: 'line',
                                yMin: 80,
                                yMax: 80,
                                borderColor: 'rgba(255, 255, 255, 0.2)',
                                borderWidth: 1,
                                borderDash: [8, 4],
                                label: {
                                    display: true,
                                    content: '80° MAX',
                                    position: 'start',
                                    yAdjust: -12,
                                    backgroundColor: 'transparent',
                                    color: 'rgba(255, 255, 255, 0.4)',
                                    font: { family: 'Orbitron', size: 9, weight: 'bold' }
                                }
                            },
                            line90: {
                                type: 'line',
                                yMin: 90,
                                yMax: 90,
                                borderColor: 'rgba(255, 255, 255, 0.1)',
                                borderWidth: 1,
                                borderDash: [3, 3],
                                label: {
                                    display: true,
                                    content: 'ZENITH',
                                    position: 'start',
                                    yAdjust: -12,
                                    backgroundColor: 'transparent',
                                    color: 'rgba(255, 255, 255, 0.2)',
                                    font: { family: 'Orbitron', size: 9 }
                                }
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
