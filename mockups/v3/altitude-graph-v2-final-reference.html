<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altitude Graph Mockup - Chart.js</title>
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-white p-8 rounded-xl shadow-lg space-y-6">
        <div class="border-b border-gray-100 pb-4">
            <h1 class="text-2xl font-bold text-gray-800">Sky Object Altitude</h1>
            <p class="text-gray-500 text-sm">Path of object from sunrise to sunset (Chart.js Implementation)</p>
        </div>

        <div class="h-[450px] w-full relative">
            <canvas id="altitudeChart"></canvas>
        </div>

        <div class="flex justify-between items-center text-xs text-gray-400 border-t border-gray-100 pt-4">
            <div class="flex gap-4">
                <div class="flex items-center gap-1">
                    <span class="w-3 h-[1px] bg-gray-400"></span>
                    <span>0°-30° / 80°-90° (1px)</span>
                </div>
                <div class="flex items-center gap-1">
                    <span class="w-3 h-[3px] bg-[#1f77b4]"></span>
                    <span>30°-80° (3px)</span>
                </div>
            </div>
            <div>STAIRS Instrumentation v3.1</div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('altitudeChart').getContext('2d');

        // Generate data points from 6 AM (6) to 6 PM (18)
        const labels = [];
        const data = [];
        const timeLabels = [];

        for (let t = 6; t <= 18; t += 0.1) {
            const hour = Math.floor(t);
            const minutes = Math.round((t - hour) * 60);

            // Format time as 12-hour
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
            const timeString = `${displayHour}:${minutes.toString().padStart(2, '0')} ${ampm}`;

            labels.push(t); // Use numerical time for X-axis logic
            timeLabels.push(timeString);

            // Altitude sine wave: 90 * sin(pi * (t - 6) / 12)
            const altitude = Math.max(0, 90 * Math.sin(Math.PI * (t - 6) / 12));
            data.push(altitude);
        }

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Altitude',
                    data: data,
                    fill: false,
                    pointRadius: 0,
                    tension: 0.1, // Smooth enough but keeps segmented logic crisp
                    segment: {
                        borderColor: ctx => {
                            const y0 = ctx.p0.parsed.y;
                            const y1 = ctx.p1.parsed.y;
                            const avg = (y0 + y1) / 2;
                            // Exact boundary checks per spec
                            if (avg >= 29.9 && avg <= 80.1) return '#1f77b4';
                            return '#808080';
                        },
                        borderWidth: ctx => {
                            const y0 = ctx.p0.parsed.y;
                            const y1 = ctx.p1.parsed.y;
                            const avg = (y0 + y1) / 2;
                            if (avg >= 29.9 && avg <= 80.1) return 3;
                            return 1;
                        }
                    }
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        min: 6,
                        max: 18,
                        title: {
                            display: true,
                            text: 'Time',
                            font: { family: 'Inter', size: 12, weight: '500' },
                            color: '#6b7280'
                        },
                        ticks: {
                            stepSize: 1,
                            callback: function(value) {
                                const h = Math.floor(value);
                                const ampm = h >= 12 ? 'PM' : 'AM';
                                const dh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
                                return `${dh} ${ampm}`;
                            },
                            font: { family: 'Inter', size: 11 },
                            color: '#9ca3af'
                        },
                        grid: {
                            display: false
                        }
                    },
                    y: {
                        min: 0,
                        max: 90,
                        title: {
                            display: true,
                            text: 'Altitude (degrees)',
                            font: { family: 'Inter', size: 12, weight: '500' },
                            color: '#6b7280'
                        },
                        ticks: {
                            stepSize: 10,
                            font: { family: 'Inter', size: 11 },
                            color: '#9ca3af'
                        },
                        grid: {
                            color: '#f0f0f0'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'white',
                        titleColor: '#374151',
                        bodyColor: '#6b7280',
                        borderColor: '#e5e7eb',
                        borderWidth: 1,
                        padding: 12,
                        cornerRadius: 8,
                        displayColors: true,
                        callbacks: {
                            title: function(items) {
                                const t = items[0].parsed.x;
                                const h = Math.floor(t);
                                const m = Math.round((t - h) * 60);
                                const ampm = h >= 12 ? 'PM' : 'AM';
                                const dh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
                                return `${dh}:${m.toString().padStart(2, '0')} ${ampm}`;
                            },
                            label: function(item) {
                                return ` Altitude: ${item.parsed.y.toFixed(2)}°`;
                            }
                        }
                    },
                    annotation: {
                        annotations: {
                            shading: {
                                type: 'box',
                                yMin: 30,
                                yMax: 80,
                                backgroundColor: 'rgba(31, 119, 180, 0.1)',
                                borderWidth: 0,
                                z: -1
                            },
                            line30: {
                                type: 'line',
                                yMin: 30,
                                yMax: 30,
                                borderColor: '#666',
                                borderWidth: 2,
                                borderDash: [8, 4],
                                label: {
                                    display: true,
                                    content: '30° (min)',
                                    position: 'start',
                                    yAdjust: -12,
                                    backgroundColor: 'transparent',
                                    color: '#666',
                                    font: { family: 'Inter', size: 11, weight: '600' }
                                }
                            },
                            line80: {
                                type: 'line',
                                yMin: 80,
                                yMax: 80,
                                borderColor: '#666',
                                borderWidth: 2,
                                borderDash: [8, 4],
                                label: {
                                    display: true,
                                    content: '80° (max)',
                                    position: 'start',
                                    yAdjust: -12,
                                    backgroundColor: 'transparent',
                                    color: '#666',
                                    font: { family: 'Inter', size: 11, weight: '600' }
                                }
                            },
                            line90: {
                                type: 'line',
                                yMin: 90,
                                yMax: 90,
                                borderColor: '#999',
                                borderWidth: 1,
                                borderDash: [3, 3],
                                label: {
                                    display: true,
                                    content: '90° (peak)',
                                    position: 'start',
                                    yAdjust: -12,
                                    backgroundColor: 'transparent',
                                    color: '#999',
                                    font: { family: 'Inter', size: 11, weight: '600' }
                                }
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
