server {
    listen 8080;
    server_name localhost;

    # Include MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy. The SPA is built with VITE_API_URL=/backend so the
    # browser never needs to know where the API lives -- which is what makes
    # https://stairs.thomasehardt.com work behind Authelia: the request carries
    # the authelia_session cookie because it is the same origin as the page.
    #
    # NOT /api: Authelia's access_control rule #1 bypasses SSO for ^/api/.*$ on
    # every *.thomasehardt.com host, which would leave this API wide open.
    #
    # The regex + resolver form (rather than a plain proxy_pass) re-resolves the
    # `api` container through Docker's embedded DNS, so recreating stairs-api
    # does not leave this nginx holding a stale IP.
    location ~ ^/backend/(.*)$ {
        resolver 127.0.0.11 valid=10s;
        set $stairs_api api;
        proxy_pass http://$stairs_api:8000/$1$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;
    }

    # Support for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets handling
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
