services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: stairs-api
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./services/api/src:/app/src
      - ./data:/app/data:ro
      - ./cache:/app_data/cache
      - ./logs:/app_data/logs
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - LOG_DIR=/app_data/logs
      - CACHE_DIR=/app_data/cache
      - HOME=/tmp
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    restart: unless-stopped

  cli:
    build:
      context: ./services/cli
      dockerfile: Dockerfile
    container_name: stairs-cli
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./services/cli/src:/app/src
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: stairs-web
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:8080"
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api

  web-dev:
    build:
      context: ./services/web
      dockerfile: Dockerfile.dev
    container_name: stairs-web-dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5173:5173"
    volumes:
      - ./services/web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api

  docs:
    build:
      context: ./stairs-academy
      dockerfile: Dockerfile.dev
    container_name: stairs-docs
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "4322:4321"
    volumes:
      - ./stairs-academy:/app
    restart: unless-stopped

  docs-dev:
    build:
      context: ./stairs-academy
      dockerfile: Dockerfile.dev
    container_name: stairs-docs-dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "4321:4321"
    volumes:
      - ./stairs-academy:/app
      - /app/node_modules
