services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: stairs-api
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./services/api/src:/app/src
      - ./data:/app/data:ro
      - ./cache:/app_data/cache
      - ./logs:/app_data/logs
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - LOG_DIR=/app_data/logs
      - CACHE_DIR=/app_data/cache
      - HOME=/tmp
      # astropy caches the IERS table here (see astro_logic/visibility.py);
      # keep it in the mounted ./cache so it survives container restarts.
      - XDG_CACHE_HOME=/app_data/cache
    command:
      [
        "uvicorn",
        "src.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    restart: unless-stopped

  cli:
    build:
      context: ./services/cli
      dockerfile: Dockerfile
    container_name: stairs-cli
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./services/cli/src:/app/src
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
      # Baked into the bundle at build time -- `environment:` below is never seen
      # by the Vite build. /backend is same-origin and proxied by this image's
      # nginx, which is what lets the app work through
      # https://stairs.thomasehardt.com behind Authelia.
      args:
        VITE_API_URL: /backend
    container_name: stairs-web
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:8080"
    environment:
      - VITE_API_URL=/backend
    depends_on:
      - api
    # Without this the container stays down after a host reboot or a
    # `compose down`, which takes https://stairs.thomasehardt.com with it.
    restart: unless-stopped

  web-dev:
    build:
      context: ./services/web
      dockerfile: Dockerfile.dev
    container_name: stairs-web-dev
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5173:5173"
    volumes:
      - ./services/web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
