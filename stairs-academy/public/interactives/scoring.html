<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Final Score Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #111;
        color: white;
        margin: 0;
        padding: 20px;
      }
      .controls {
        background: #222;
        padding: 12px 18px;
        border-radius: 8px;
        width: fit-content;
        margin: 10px auto;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        padding: 7px 16px;
        font-size: 13px;
        cursor: pointer;
        background: #444;
        color: white;
        border: 1px solid #666;
        border-radius: 4px;
      }
      button:hover {
        background: #555;
      }
      button.active {
        background: #285;
        border-color: #4a8;
      }
      a.back {
        color: #88f;
        text-decoration: none;
        display: block;
        margin-bottom: 18px;
      }
      #canvas-container {
        margin-top: 16px;
        display: flex;
        justify-content: center;
      }
      p {
        color: #aaa;
        max-width: 800px;
        margin: 0 auto 12px auto;
        line-height: 1.5;
        font-size: 13px;
      }
      input[type="range"] {
        width: 90px;
        vertical-align: middle;
      }
      label {
        color: #ccc;
        font-size: 13px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .val {
        color: #fff;
        font-weight: bold;
        min-width: 28px;
        text-align: center;
        font-size: 13px;
      }
    </style>
    <style>
      canvas {
        max-width: 100%;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <a href="/stairs-docs/05-planning/scoring-pipeline/" class="back"
      >← Chapter 5: Scoring Pipeline</a
    >
    <h1>Final Score Animation</h1>
    <p>
      STAIRS computes a target's suitability through a multi-stage pipeline:
      Object Suitability Score (OSS) → Sky Quality Score (SQS) multiplier →
      final relative score → Absolute Quality Score (AQS) modified by Bortle
      light pollution.
    </p>
    <div class="controls">
      <label
        >Target
        <select
          id="targetSelect"
          style="
            background: #333;
            color: white;
            border: 1px solid #666;
            padding: 4px 8px;
            border-radius: 4px;
          "
        >
          <option>M42 Orion Nebula</option>
          <option>M31 Andromeda</option>
          <option>M57 Ring Nebula</option>
          <option>M13 Hercules Cluster</option>
          <option>NGC 7000 N. American</option>
          <option>NGC 7331 Deer Lick</option>
        </select></label
      >
      <label
        >Bortle
        <input type="range" id="bortleSlider" min="1" max="9" value="5" />
        <span id="bortleVal" class="val">5</span></label
      >
      <label
        >Moon
        <input type="range" id="moonSlider" min="0" max="100" value="30" />
        <span id="moonVal" class="val">30%</span></label
      >
      <label
        >Clouds
        <input type="range" id="cloudSlider" min="0" max="100" value="10" />
        <span id="cloudVal" class="val">10%</span></label
      >
      <br />
      <button id="stepBtn">▶ Step</button>
      <button id="autoBtn">▶ Auto</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div id="canvas-container"></div>
    <script src="scoring.js"></script>
  </body>
</html>
