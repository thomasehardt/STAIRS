<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sub-Exposure Optimization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #111;
        color: white;
        margin: 0;
        padding: 20px;
      }
      .controls {
        background: #222;
        padding: 12px 18px;
        border-radius: 8px;
        width: fit-content;
        margin: 10px auto;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        padding: 7px 16px;
        font-size: 13px;
        cursor: pointer;
        background: #444;
        color: white;
        border: 1px solid #666;
        border-radius: 4px;
      }
      button:hover {
        background: #555;
      }
      a.back {
        color: #88f;
        text-decoration: none;
        display: block;
        margin-bottom: 18px;
      }
      #canvas-container {
        margin-top: 16px;
        display: flex;
        justify-content: center;
      }
      p {
        color: #aaa;
        max-width: 800px;
        margin: 0 auto 12px auto;
        line-height: 1.5;
        font-size: 13px;
      }
      input[type="range"] {
        width: 80px;
        vertical-align: middle;
      }
      label {
        color: #ccc;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .val {
        color: #fff;
        font-weight: bold;
        min-width: 28px;
        text-align: center;
        font-size: 12px;
      }
    </style>
    <style>
      canvas {
        max-width: 100%;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <a href="/stairs-docs/05-planning/oss/" class="back"
      >← Chapter 5: Sub-Exposure</a
    >
    <h1>Sub-Exposure Optimization</h1>
    <p>
      The goal is to "swamp the read noise" — expose long enough that sky noise
      dominates read noise by 10×. The optimal sub-exposure time balances read
      noise against sky glow.
    </p>
    <div class="controls">
      <label
        >Read Noise
        <input
          type="range"
          id="rnSlider"
          min="1"
          max="10"
          value="3"
          step="0.1"
        />
        <span id="rnVal" class="val">3.0</span> e⁻</label
      >
      <label
        >Bortle
        <input type="range" id="bortleSlider" min="1" max="9" value="5" />
        <span id="bortleVal" class="val">5</span></label
      >
      <label
        >QE <input type="range" id="qeSlider" min="10" max="100" value="80" />
        <span id="qeVal" class="val">80</span>%</label
      >
    </div>
    <div id="canvas-container"></div>
    <script src="subexposure.js"></script>
  </body>
</html>
