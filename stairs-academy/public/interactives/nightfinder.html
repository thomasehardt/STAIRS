<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Astronomical Night Finder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #111;
        color: white;
        margin: 0;
        padding: 20px;
      }
      .controls {
        background: #222;
        padding: 12px 18px;
        border-radius: 8px;
        width: fit-content;
        margin: 10px auto;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        padding: 7px 16px;
        font-size: 13px;
        cursor: pointer;
        background: #444;
        color: white;
        border: 1px solid #666;
        border-radius: 4px;
      }
      button:hover {
        background: #555;
      }
      button.active {
        background: #285;
        border-color: #4a8;
      }
      a.back {
        color: #88f;
        text-decoration: none;
        display: block;
        margin-bottom: 18px;
      }
      #canvas-container {
        margin-top: 16px;
        display: flex;
        justify-content: center;
      }
      p {
        color: #aaa;
        max-width: 800px;
        margin: 0 auto 12px auto;
        line-height: 1.5;
        font-size: 13px;
      }
      input[type="range"] {
        width: 80px;
        vertical-align: middle;
      }
      label {
        color: #ccc;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .val {
        color: #fff;
        font-weight: bold;
        min-width: 28px;
        text-align: center;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <a href="/stairs-docs/05-planning/sqs/" class="back"
      >← Chapter 5: Night Finder</a
    >
    <h1>Astronomical Night Finder</h1>
    <p>
      STAIRS determines when it\u2019s dark enough to image by tracking the
      Sun\u2019s altitude below -18\u00b0. It scans forward up to 14 days to
      find the next viable night window, handling edge cases like polar summer
      where the Sun never sets.
    </p>
    <div class="controls">
      <label
        >Latitude
        <input type="range" id="latSlider" min="-60" max="60" value="36" />
        <span id="latVal" class="val">36</span>\u00b0</label
      >
      <label
        >Day of year
        <input type="range" id="daySlider" min="1" max="365" value="180" />
        <span id="dayVal" class="val">180</span></label
      >
      <button id="playBtn">▶ Scan</button>
      <button id="resetBtn">Reset</button>
    </div>
    <div id="canvas-container"></div>
    <script src="nightfinder.js"></script>
  </body>
</html>
