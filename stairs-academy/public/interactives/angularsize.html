<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Angular Size vs. Distance</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #111;
        color: white;
        margin: 0;
        padding: 20px;
      }
      .controls {
        background: #222;
        padding: 15px;
        border-radius: 8px;
        width: fit-content;
        margin: 10px auto;
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      #canvas-container {
        margin-top: 20px;
        display: flex;
        justify-content: center;
      }
      input[type="range"] {
        width: 220px;
      }
      label {
        font-weight: bold;
        color: #ccc;
      }
      .val {
        color: #88f;
        font-weight: bold;
        min-width: 90px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <h1>Angular Size vs. Distance</h1>
    <p>
      Two very different (true size, distance) pairs can produce the exact same
      apparent size in the eyepiece.
    </p>
    <div class="controls">
      <label
        >True Size:
        <input
          type="range"
          id="sizeSlider"
          min="0"
          max="5.5"
          step="0.02"
          value="1.4"
        />
        <span class="val" id="sizeVal">25 ly</span></label
      >
      <label
        >Distance:
        <input
          type="range"
          id="distSlider"
          min="1"
          max="8"
          step="0.02"
          value="3.1"
        />
        <span class="val" id="distVal">1,300 ly</span></label
      >
    </div>
    <div id="canvas-container"></div>
    <script src="angularsize.js"></script>
  </body>
</html>
