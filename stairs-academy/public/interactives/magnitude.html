<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Magnitude: Linear vs. Log Scale</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #111;
        color: white;
        margin: 0;
        padding: 20px;
      }
      .controls {
        background: #222;
        padding: 15px;
        border-radius: 8px;
        width: fit-content;
        margin: 10px auto;
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      #canvas-container {
        margin-top: 20px;
        display: flex;
        justify-content: center;
      }
      input[type="range"] {
        width: 260px;
      }
      label {
        font-weight: bold;
        color: #ccc;
      }
      .val {
        color: #88f;
        font-weight: bold;
        min-width: 40px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <h1>Magnitude: Linear vs. Log Scale</h1>
    <p>
      The same set of objects, plotted two ways. This is why astronomers use a
      logarithmic brightness scale.
    </p>
    <div class="controls">
      <label
        >Magnitude:
        <input
          type="range"
          id="magSlider"
          min="-5"
          max="15"
          step="0.1"
          value="5.0"
        />
        <span class="val" id="magVal">5.0</span></label
      >
    </div>
    <div id="canvas-container"></div>
    <script src="magnitude.js"></script>
  </body>
</html>
