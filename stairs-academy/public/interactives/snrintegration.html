<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SNR vs Integration Time</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #111;
        color: white;
        margin: 0;
        padding: 20px;
      }
      .controls {
        background: #222;
        padding: 12px 18px;
        border-radius: 8px;
        width: fit-content;
        margin: 10px auto;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        padding: 7px 16px;
        font-size: 13px;
        cursor: pointer;
        background: #444;
        color: white;
        border: 1px solid #666;
        border-radius: 4px;
      }
      button:hover {
        background: #555;
      }
      button.active {
        background: #285;
        border-color: #4a8;
      }
      a.back {
        color: #88f;
        text-decoration: none;
        display: block;
        margin-bottom: 18px;
      }
      #canvas-container {
        margin-top: 16px;
        display: flex;
        justify-content: center;
      }
      p {
        color: #aaa;
        max-width: 800px;
        margin: 0 auto 12px auto;
        line-height: 1.5;
        font-size: 13px;
      }
      input[type="range"] {
        width: 80px;
        vertical-align: middle;
      }
      label {
        color: #ccc;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .val {
        color: #fff;
        font-weight: bold;
        min-width: 28px;
        text-align: center;
        font-size: 12px;
      }
    </style>
    <style>
      canvas {
        max-width: 100%;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <a href="/stairs-docs/04-stacking/why-stack/" class="back"
      >← Chapter 4: SNR Integration</a
    >
    <h1>SNR vs Integration Time</h1>
    <p>
      Signal-to-Noise Ratio grows as the square root of total integration time.
      Each additional frame adds signal linearly, but noise only grows as
      \u221aN. Doubling integration improves SNR by \u224141%.
    </p>
    <div class="controls">
      <label
        >Sub time
        <input type="range" id="subSlider" min="5" max="60" value="15" />
        <span id="subVal" class="val">15</span>s</label
      >
      <label
        >Target SNR
        <input type="range" id="targetSlider" min="5" max="50" value="10" />
        <span id="targetVal" class="val">10</span></label
      >
      <label
        >Per-sub SNR
        <input
          type="range"
          id="perSubSlider"
          min="0.5"
          max="5"
          value="1"
          step="0.1"
        />
        <span id="perSubVal" class="val">1.0</span></label
      >
      <button id="playBtn" class="active">⏸ Pause</button>
    </div>
    <div id="canvas-container"></div>
    <script src="snrintegration.js"></script>
  </body>
</html>
