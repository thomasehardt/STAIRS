<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Atmospheric Seeing Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        background: #111;
        color: white;
        margin: 0;
        padding: 20px;
      }
      .controls {
        background: #222;
        padding: 15px;
        border-radius: 8px;
        width: fit-content;
        margin: 10px auto;
        display: flex;
        gap: 20px;
        align-items: center;
      }
      #canvas-container {
        margin-top: 20px;
        display: flex;
        justify-content: center;
      }
      input[type="range"] {
        width: 200px;
      }
      label {
        font-weight: bold;
        color: #ccc;
      }
      .val {
        color: #fff;
        min-width: 40px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <h1>Atmospheric Seeing Simulator</h1>
    <div class="controls">
      <label
        >Seeing:
        <input
          type="range"
          id="seeingSlider"
          min="0.5"
          max="10"
          step="0.1"
          value="2.0"
        />
        <span class="val" id="seeingVal">2.0"</span></label
      >
      <label
        >Wind:
        <input
          type="range"
          id="windSlider"
          min="0"
          max="5"
          step="0.1"
          value="1.0"
        />
        <span class="val" id="windVal">1.0</span></label
      >
    </div>
    <div id="canvas-container"></div>
    <script src="seeing.js"></script>
  </body>
</html>
